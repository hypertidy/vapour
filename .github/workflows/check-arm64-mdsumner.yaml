jobs:
  check-macos-gdal312:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL 3.12.4 static stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download darwin23-gdal3124 -R mdsumner/recipes \
            -p '*-darwin.*-arm64.tar.xz' -D /tmp/libs
          for f in /tmp/libs/*.tar.xz; do sudo tar xJf "$f" -C /; done
          echo "/opt/R/arm64/bin" >> "$GITHUB_PATH"
      - uses: r-lib/actions/setup-r@v2
      - name: Check against new stack
        run: |
          export PKG_CONFIG_PATH=/opt/R/arm64/lib/pkgconfig
          Rscript -e 'install.packages(".", repos=NULL, type="source")'
